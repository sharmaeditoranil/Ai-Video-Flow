name: Build Apps

# Builds standalone AI Video Flow apps:
#   Windows  -> AI-Video-Flow-Windows-Setup.exe
#   macOS    -> AI-Video-Flow-Mac-arm64.dmg (Apple Silicon) and AI-Video-Flow-Mac-x86_64.dmg (Intel)
# Run manually from the Actions tab, or push a tag like v1.1.0 to also publish a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean --log-level WARN --distpath build/dist --workpath build/work packaging/ai_video_flow.spec
      - name: Smoke test MCP helper
        shell: bash
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | "build/dist/AI Video Flow/ai-video-flow-mcp.exe" | grep -q serverInfo
      - name: Inno Setup installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q packaging\windows_installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Flow-Windows
          path: dist/AI-Video-Flow-Windows-Setup.exe

  macos:
    strategy:
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build app and DMG
        run: PYTHON="$(which python)" bash packaging/build_mac_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Flow-Mac-${{ matrix.runner }}
          path: dist/AI-Video-Flow-Mac-*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
