plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace "com.aivideoflow.reels"
    compileSdk 34

    defaultConfig {
        applicationId "com.aivideoflow.reels"
        minSdk 26
        targetSdk 34
        versionCode 16
        versionName "1.1.16"

        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            version "3.10"
            if (file("/opt/homebrew/bin/python3.12").exists()) {
                buildPython "/opt/homebrew/bin/python3.12"
            }
            pip {
                options "--ignore-requires-python"
                install "numpy"
                install "Pillow"
                install "opencv-python"
                install "scipy"
                install "cryptography"
            }
        }
    }

    sourceSets {
        main {
            python.srcDirs = ["src/main/python"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
