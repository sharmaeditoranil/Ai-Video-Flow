<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Video Flow - Workflow Integration Panel</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #18181b;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #27272a;
      margin-bottom: 16px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #7928ca;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #27272a;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      margin-bottom: 16px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      color: #a1a1aa;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .btn {
      width: 100%;
      padding: 9px 12px;
      background: #7928ca;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #6b21a8;
    }
    .btn-secondary {
      background: #27272a;
      color: #e4e4e7;
    }
    .btn-secondary:hover {
      background: #3f3f46;
    }
    .info-card {
      background: #27272a;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div class="title">AI Video Flow</div>
  </div>

  <div class="status-badge">
    <div class="dot"></div>
    <span>Claude AI Connected (MCP)</span>
  </div>

  <div class="section-title">Quick AI Editing Tools</div>
  <button class="btn" id="btn-sync-beats">🎵 Sync Cuts to Music Beats</button>
  <button class="btn" id="btn-trim-shake">✂️ Auto-Trim Shaky Starts (1500 Clips)</button>
  <button class="btn" id="btn-make-teaser">🎬 Generate 60s Reel (9:16)</button>

  <div class="section-title" style="margin-top: 16px;">Active Project Status</div>
  <div class="info-card">
    <div><strong>Control:</strong> Claude Desktop Active</div>
    <div><strong>Voice/Text:</strong> Hindi, Hinglish & English</div>
    <div><strong>Timeline Sync:</strong> Bi-directional</div>
  </div>

  <button class="btn btn-secondary" id="btn-open-dash">Open Full Dashboard</button>

  <script>
    document.getElementById("btn-sync-beats").onclick = () => alert("Syncing cuts to music beats on active timeline...");
    document.getElementById("btn-trim-shake").onclick = () => alert("Running Optical Flow camera shake trimming on raw clips...");
    document.getElementById("btn-make-teaser").onclick = () => alert("Assembling 60s vertical teaser sequence in Resolve...");
  </script>
</body>
</html>
